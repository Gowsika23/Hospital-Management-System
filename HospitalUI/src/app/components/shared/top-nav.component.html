<header class="top-nav" [class.top-nav-solid]="solid">
  <div class="brand" (click)="itemClick.emit('home')">
    <span class="brand-mark">+</span>
    <div>
      <h2>{{ brand }}</h2>
      <p>Hospital management made elegant</p>
    </div>
  </div>

  <nav class="nav-links">
    @for (item of navItems; track item.label) {
      <button
        type="button"
        [class.nav-active]="activeAction === item.action"
        (click)="itemClick.emit(item.action)"
      >
        {{ item.label }}
      </button>
    }
  </nav>

  <div class="nav-actions">
    @if (showUserBadge) {
      <div class="user-badge">{{ userName }}</div>
    }
    @if (ctaSecondary) {
      <button type="button" class="ghost-btn" (click)="secondaryClick.emit()">
        {{ ctaSecondary }}
      </button>
    }
    @if (ctaPrimary) {
      <button type="button" class="primary-btn" (click)="primaryClick.emit()">
        {{ ctaPrimary }}
      </button>
    }
  </div>
</header>
